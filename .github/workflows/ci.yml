name: SDK validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Preserve source bytes for provenance checks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check layers and upstream provenance
        run: |
          node check-layers.mjs
          git clone https://github.com/chrisle/rbxport.git --no-checkout upstream
          git -C upstream checkout 7fb4dad3f88a2cc0cecec0e718b4dde408fd7448
          node check-upstream.mjs upstream
      - name: Test shipped SDK crates
        run: >
          cargo test --locked --workspace --no-fail-fast
          --exclude rbl-analysis --exclude rbl-db
          --exclude rbl-devices --exclude rbl-index
