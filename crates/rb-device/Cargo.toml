[package]
name = "rb-device"
description = "USB sticks and drives rekordbox has exported to: finding them and reading their libraries."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
fs2 = "0.4"
plist = "1"
rb-storage = { path = "../rb-storage" }
rbl-onelibrary = { path = "../rbl-onelibrary" }
rbl-pdb = { path = "../rbl-pdb" }
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
rbl-export = { path = "../rbl-export" }
tempfile = "3"
